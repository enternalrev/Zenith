app = "ze.py"
primary_region = "sin" # Pick a region close to you

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080 # Your bot doesn't use HTTP, but Fly needs a port
  force_https = true
  auto_stop_machines = "off" # CRITICAL: Keeps the bot from sleeping
  auto_start_machines = true
  min_machines_running = 1 # CRITICAL: Ensures at least 1 instance runs

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
